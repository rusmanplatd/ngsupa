<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NgSupa — Modern Angular App</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A modern Angular application with Apple-inspired UI, Supabase authentication, and Firebase Cloud Messaging.">
  <meta name="color-scheme" content="light dark">
  <script>
    {
      const stored = localStorage.getItem('ngsupa-color-scheme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const resolved = stored === 'light' || stored === 'dark'
        ? stored
        : (prefersDark ? 'dark' : 'light');
      const pref = stored === 'light' || stored === 'dark' ? stored : 'system';

      // Set color-scheme CSS property so CSS light-dark() tokens resolve on first paint
      document.documentElement.style.colorScheme = pref === 'system' ? 'light dark' : resolved;

      // Set meta tag for browser UI chrome
      document.querySelector('meta[name="color-scheme"]').content =
        pref === 'system' ? 'light dark' : resolved;

      // Toggle .dark class for Tailwind dark: variants
      if (resolved === 'dark') {
        document.documentElement.classList.add('dark');
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>
</body>
</html>
